name: hourly-ingest

on:
  schedule:
    - cron: "10 * * * *" # 매시 10분 — Vercel Hobby 크론(일 1회) 한계 보완
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      # Vercel에서 fetch하면 우아한형제들(403)·velog(타임아웃)가 막혀서
      # GitHub 러너에서 직접 수집해 DB에 쓴다.
      - name: Run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/ingest.ts
