name: weekly-trends

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST — 주간 트렌드 리포트 발행
  workflow_dispatch: {}

concurrency:
  group: weekly-trends
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Publish weekly trends
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/weekly-trends.ts
