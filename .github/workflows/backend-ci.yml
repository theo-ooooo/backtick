name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: backtick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d backtick_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BACKEND_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/backtick_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Apply migrations to the disposable test database
        run: npx prisma migrate deploy --schema ../prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/backtick_test
      - run: npm test
